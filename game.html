<!DOCTYPE html>
<html lang="ko">
<head>

  <script>

    if (location.protocol !== 'file:' && !location.hostname.includes('127.0.0.1') && !location.hostname.includes('localhost') && !location.hostname.includes('github.io')) {
      const baseEl = document.createElement('base');
      baseEl.href = 'https://raw.githubusercontent.com/hgkim-one/taeo-merge-assets/main/';
      document.head.appendChild(baseEl);
    }
    const BLANK_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    function getDriveAtlasAttrs(rawSrc, extraStyle = '') {

  <title>태오의 머지 에볼루션 (Taeo's Merge Evolution)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --slot-bg: #141e33;
      --slot-hover: #1e3a5f;
      --slot-mergeable: #065f46;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    /* Container */
    .game-wrapper {
      max-width: 580px;
      width: 100%;
      background: rgba(30, 41, 59, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .title-area h1 {
      font-size: 1.32rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .title-area p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-pill:hover {
      background: rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #334155;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #475569;
      transform: translateY(-2px);
    }

    .icon-btn.menu-highlight {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
    }

    /* Stats Board */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      min-width: 0;
      overflow: hidden;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value.max-lvl-val {
      color: #f472b6;
      font-size: 1.02rem;
    }

    /* Spawn Control */
    .spawn-bar-wrapper {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spawn-info {
      flex: 1;
      min-width: 0;
    }

    .spawn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .spawn-range-badge {
      color: #34d399;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.7rem;
    }

    .progress-track {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .spawn-now-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .spawn-now-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .spawn-now-btn:active {
      transform: translateY(0);
    }

    .spawn-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .purge-low-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      padding: 9px 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .purge-low-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }

    .purge-low-btn:active {
      transform: translateY(0);
    }

    .game-wrapper[data-compact="true"] {
      padding: 8px 10px;
      gap: 5px;
      border-radius: 14px;
    }
    .game-wrapper[data-mobile="true"] {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100dvh !important;
      max-height: 100dvh !important;
      padding: 6px 8px !important;
      gap: 5px !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      justify-content: space-between;
    }
    .game-wrapper[data-compact="true"] .game-header {
      align-items: center;
      min-height: 32px;
    }
    .game-wrapper[data-compact="true"] .title-area {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .game-wrapper[data-compact="true"] .title-area h1 {
      font-size: 0.96rem;
      white-space: nowrap;
    }
    .game-wrapper[data-compact="true"] .title-area p {
      display: none !important;
    }
    .game-wrapper[data-compact="true"] .mode-badge {
      margin-top: 0;
      font-size: 0.64rem;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .game-wrapper[data-compact="true"] .header-btns {
      gap: 4px;
      flex-shrink: 0;
    }
    .game-wrapper[data-compact="true"] .icon-btn {
      width: 30px;
      height: 30px;
      font-size: 0.88rem;
      border-radius: 8px;
    }
    .game-wrapper[data-compact="true"] .stats-row {
      gap: 5px;
    }
    .game-wrapper[data-compact="true"] .stat-card {
      padding: 3px 5px;
      border-radius: 9px;
    }
    .game-wrapper[data-compact="true"] .stat-label {
      font-size: 0.56rem;
    }
    .game-wrapper[data-compact="true"] .stat-value {
      font-size: 0.86rem;
      margin-top: 1px;
    }
    .game-wrapper[data-compact="true"] .spawn-bar-wrapper {
      padding: 5px 8px;
      gap: 5px;
      border-radius: 10px;
      flex-direction: column;
      align-items: stretch;
    }
    .game-wrapper[data-compact="true"] .spawn-info {
      width: 100%;
    }
    .game-wrapper[data-compact="true"] .spawn-label {
      font-size: 0.68rem;
      white-space: nowrap;
    }
    .game-wrapper[data-compact="true"] .progress-track {
      height: 5px;
    }
    .game-wrapper[data-compact="true"] .spawn-btn-group {
      width: 100%;
      display: flex;
      gap: 6px;
    }
    .game-wrapper[data-compact="true"] .spawn-now-btn,
    .game-wrapper[data-compact="true"] .purge-low-btn {
      flex: 1;
      justify-content: center;
      padding: 5px 8px;
      font-size: 0.72rem;
      border-radius: 8px;
    }
    .game-wrapper[data-compact="true"] .board-container {
      padding: 6px;
      border-radius: 14px;
    }
    .game-wrapper[data-compact="true"] .trash-zone {
      height: 30px;
      font-size: 0.72rem;
      border-radius: 9px;
    }

    .game-wrapper[data-layout="landscape"] {
      max-width: 98vw !important;
      width: auto !important;
      height: auto !important;
      display: grid !important;
      grid-template-columns: minmax(230px, 310px) auto;
      grid-template-areas:
        "header board"
        "stats board"
        "spawn board"
        "bottom board";
      align-items: center;
      column-gap: 12px;
      row-gap: 4px;
      padding: 6px 10px !important;
    }
    .game-wrapper[data-layout="landscape"] .game-header { grid-area: header; }
    .game-wrapper[data-layout="landscape"] .stats-row { grid-area: stats; }
    .game-wrapper[data-layout="landscape"] .spawn-bar-wrapper { grid-area: spawn; flex-direction: column; align-items: stretch; }
    .game-wrapper[data-layout="landscape"] .spawn-btn-group { justify-content: stretch; }
    .game-wrapper[data-layout="landscape"] .spawn-now-btn,
    .game-wrapper[data-layout="landscape"] .purge-low-btn { flex: 1; justify-content: center; }
    .game-wrapper[data-layout="landscape"] .board-container { grid-area: board; }
    .game-wrapper[data-layout="landscape"] .bottom-bar { grid-area: bottom; }

    /* Grid Board & Dynamic --cell-size Proportional Scaling */
    .board-container {
      position: relative;
      background: #090e1a;
      padding: 10px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-board {
      --cell-size: 64px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .grid-slot {
      background: var(--slot-bg);
      border-radius: clamp(4px, calc(var(--cell-size, 64px) * 0.16), 12px);
      border: 1.5px dashed rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      cursor: default;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .grid-slot.drag-over-empty {
      background: var(--slot-hover);
      border-color: #38bdf8;
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .grid-slot.drag-over-merge {
      background: var(--slot-mergeable);
      border-color: #34d399;
      transform: scale(1.04);
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.5);
    }

    .grid-slot.drag-over-swap {
      background: #475569;
      border-color: #94a3b8;
    }

    /* Item Tile */
    .item-tile {
      width: 94%;
      height: 94%;
      border-radius: clamp(4px, calc(var(--cell-size, 64px) * 0.15), 11px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      position: relative;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.35);
      touch-action: none;
      overflow: hidden;
    }

    .item-tile:active {
      cursor: grabbing;
    }

    .item-icon {
      font-size: clamp(13px, calc(var(--cell-size, 64px) * 0.42), 32px);
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .item-img {
      width: 68%;
      height: 68%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55));
      margin-top: 1px;
      margin-bottom: 3px;
    }

    .item-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.75);
      font-size: clamp(11px, calc(var(--cell-size, 64px) * 0.32), 22px);
      pointer-events: none;
    }

    .item-level {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: clamp(7px, calc(var(--cell-size, 64px) * 0.145), 11px);
      line-height: 1.1;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 1px 3px rgba(0,0,0,0.95);
      pointer-events: none;
      z-index: 2;
    }

    .item-badge-right {
      position: absolute;
      top: 1px;
      right: 2px;
      font-size: clamp(6.5px, calc(var(--cell-size, 64px) * 0.125), 10px);
      line-height: 1.15;
      font-weight: 800;
      color: #fde047;
      background: rgba(0, 0, 0, 0.48);
      padding: 0px 3px;
      border-radius: 3px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 2;
    }

    .grid-board[data-small-cell="true"] .item-badge-right {
      display: none;
    }

    .item-name {
      position: absolute;
      bottom: 1px;
      font-size: clamp(7px, calc(var(--cell-size, 64px) * 0.145), 11px);
      line-height: 1.15;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 1px 3px rgba(0,0,0,0.95);
      background: rgba(0, 0, 0, 0.38);
      padding: 0 3px;
      border-radius: 3px;
      pointer-events: none;
      max-width: 94%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      z-index: 2;
    }

    /* Floating Drag Clone */
    .drag-clone {
      position: fixed;
      pointer-events: none;
      z-index: 1500;
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1.14);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      transition: none;
      overflow: hidden;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .trash-zone {
      flex: 1;
      height: 46px;
      background: rgba(239, 68, 68, 0.1);
      border: 2px dashed rgba(239, 68, 68, 0.32);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #f87171;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .trash-zone.drag-over {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .tier-max-cosmic {
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #a855f7) !important;
      background-size: 300% 300% !important;
      animation: cosmicShift 3s ease infinite !important;
      box-shadow: 0 0 22px rgba(254, 202, 87, 0.75) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.85) !important;
    }

    @keyframes cosmicShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes mergePop {
      0% { transform: scale(0.55); }
      60% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }

    .merge-pop {
      animation: mergePop 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes luckyJackpotGlow {
      0% { transform: scale(0.5); box-shadow: 0 0 0px #facc15; }
      50% { transform: scale(1.28); box-shadow: 0 0 28px #facc15, 0 0 48px #f472b6; }
      100% { transform: scale(1); box-shadow: 0 0 18px rgba(250, 204, 21, 0.85); }
    }

    .event-anim-tile {
      outline: 2px solid #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.75), inset 0 0 12px rgba(250, 204, 21, 0.45);
    }
    .event-aura-overlay {
      position: absolute;
      inset: 2px;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
      opacity: 0.92;
    }
    .event-format-tag {
      position: absolute;
      bottom: 15px;
      right: 2px;
      background: linear-gradient(135deg, #f43f5e, #a855f7);
      color: #fff;
      font-size: 0.44rem;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 4px;
      z-index: 4;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      letter-spacing: 0.2px;
    }

    .lucky-jackpot {
      animation: luckyJackpotGlow 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: 2px solid #fde047;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 22px;
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    /* Launcher Modal Specifics */
    .launcher-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      margin: 12px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .theme-cards-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }

    body[data-mobile="true"] .theme-cards-grid {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .theme-cards-grid {
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 8px;
      }
      .modal-backdrop {
        padding: 8px;
        align-items: flex-start;
        padding-top: 8px;
      }
      .modal-content {
        padding: 14px 12px;
        max-height: calc(100dvh - 16px);
        border-radius: 16px;
      }
      .theme-card {
        padding: 10px 12px;
      }
    }

    .theme-card {
      min-width: 0;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .theme-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }

    .theme-card.active {
      background: rgba(14, 116, 144, 0.28);
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
    }

    .theme-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-card-preview {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .theme-card-preview img {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    .theme-card-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .theme-card-stages {
      font-size: 0.7rem;
      color: #38bdf8;
      font-weight: 700;
    }

    .theme-card-desc {
      font-size: 0.7rem;
      color: #94a3b8;
      line-height: 1.35;
    }

    .grid-size-selector {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .grid-size-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .grid-size-btn:hover {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .grid-size-btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .grid-size-btn .g-dim {
      font-size: 0.88rem;
      font-weight: 800;
    }

    .grid-size-btn .g-label {
      font-size: 0.62rem;
      color: #94a3b8;
    }

    .grid-size-btn.active .g-label {
      color: #7dd3fc;
    }

    .slot-status-box {
      margin-top: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-status-info {
      font-size: 0.8rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .launcher-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .launcher-btn {
      flex: 1;
      min-width: 140px;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .launcher-btn.primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .launcher-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.5);
    }

    .launcher-btn.secondary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .launcher-btn.secondary:hover {
      transform: translateY(-2px);
    }

    .launcher-btn.danger {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .launcher-btn.danger:hover {
      background: rgba(239, 68, 68, 0.28);
      transform: translateY(-2px);
    }

    /* Catalog List */
    .catalog-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .series-group {
      background: rgba(15, 23, 42, 0.65);
      border-radius: 12px;
      padding: 12px;
    }

    .series-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .series-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 8px;
    }

    .catalog-item-card {
      background: #0f172a;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    }

    .catalog-item-card:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.25);
    }

    .catalog-item-card.locked {
      opacity: 0.38;
      filter: grayscale(1);
    }

    .catalog-item-card.locked:hover {
      opacity: 0.65;
      border-color: #94a3b8;
    }

    /* Character Detail Card Modal */
    #itemDetailModal {
      z-index: 2600;
    }

    .detail-card-modal {
      max-width: 440px;
      padding: 0;
      overflow: hidden;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      background: #0f172a;
    }

    .detail-hero-box {
      position: relative;
      padding: 26px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .detail-top-badges {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      z-index: 2;
    }

    .detail-pill {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f8fafc;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .detail-pill.accent {
      color: #fde047;
      border-color: rgba(253, 224, 71, 0.45);
    }

    @keyframes floatHero {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.04); }
    }

    .detail-visual-wrap {
      width: 185px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatHero 3.2s ease-in-out infinite;
      z-index: 2;
    }

    .detail-visual-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.65));
    }

    .detail-visual-wrap .detail-big-icon {
      font-size: 5.6rem;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
    }

    .detail-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-title-area {
      text-align: center;
    }

    .detail-name {
      font-size: 1.42rem;
      font-weight: 900;
      color: #f8fafc;
      letter-spacing: -0.4px;
    }

    .detail-subtitle {
      font-size: 0.82rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }

    .detail-desc-box {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.86rem;
      line-height: 1.62;
      color: #e2e8f0;
      word-break: keep-all;
    }

    .detail-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-stat-item {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .detail-stat-label {
      font-size: 0.68rem;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .detail-stat-val {
      font-size: 0.92rem;
      font-weight: 800;
      color: #34d399;
    }

    .detail-nav-row {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .detail-nav-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1e293b;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.18s;
    }

    .detail-nav-btn:hover:not(:disabled) {
      background: #334155;
      border-color: #38bdf8;
    }

    .detail-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .detail-nav-btn.close-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
    }

    .catalog-icon {
      font-size: 1.65rem;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .catalog-icon img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .catalog-name {
      font-size: 0.68rem;
      font-weight: 700;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .catalog-lvl {
      font-size: 0.6rem;
      color: var(--text-muted);
    }

    /* Full Alert */
    .board-full-notice {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      display: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      white-space: nowrap;
      pointer-events: none;
      z-index: 20;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      z-index: 3000;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>

<body>

  <div class="toast" id="toast">새로운 도감 등록! 🎉</div>

  <div class="game-wrapper">
    <!-- Header -->
    <div class="game-header">
      <div class="title-area">
        <h1 id="mainTitle">🌱 태오의 머지 에볼루션</h1>
        <p>
          <span id="subtitleText">과일에서 전설의 코스믹 태오까지</span>
          <span class="mode-pill" id="modeBadgeBtn" title="테마 및 그리드 크기 변경">⚙️ 과일형 · 5x5</span>
        </p>
      </div>
      <div class="header-actions">
        <button class="icon-btn menu-highlight" id="homeBtn" title="테마 & 그리드 설정 / 시작 모달">🏠</button>
        <button class="icon-btn" id="soundBtn" title="효과음 토글">🔊</button>
        <button class="icon-btn" id="bookBtn" title="도감 보기">📖</button>
        <button class="icon-btn" id="resetBtn" title="현재 슬롯 처음부터 다시하기">🔄</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">현재 점수</div>
        <div class="stat-value" id="scoreDisplay">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">최고 점수</div>
        <div class="stat-value" id="bestScoreDisplay">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">최고 해금 등급</div>
        <div class="stat-value max-lvl-val" id="maxLevelDisplay">Lv.1</div>
      </div>
    </div>

    <!-- Spawn Control -->
    <div class="spawn-bar-wrapper">
      <div class="spawn-info">
        <div class="spawn-header">
          <span>다음 자동 스폰: <strong id="spawnTimerText">3.0초</strong></span>
          <span class="spawn-range-badge" id="spawnRangeBadge">스폰 범위: Lv.1 ~ Lv.1</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="spawnProgress"></div>
        </div>
      </div>
      <div class="spawn-btn-group">
        <button class="spawn-now-btn" id="spawnNowBtn">⚡ 즉시 생성</button>
        <button class="purge-low-btn" id="purgeLowSpawnBtn" title="현재 스폰 범위보다 낮은 등급의 하위 스폰을 일괄 제거합니다">🧹 하위 스폰 제거</button>
      </div>
    </div>

    <!-- Dynamic N x N Board -->
    <div class="board-container">
      <div class="grid-board" id="gridBoard" data-grid="5"></div>
      <div class="board-full-notice" id="fullNotice">⚠️ 보드가 가득 찼습니다! (휴지통에 버려 공간 확보)</div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
      <div class="trash-zone" id="trashZone">
        <span>🗑️ 여기에 드래그하여 버리기</span>
      </div>
    </div>
  </div>

  <!-- Launcher / Start Modal (Theme & Grid Selection + Resume/New Game) -->
  <div class="modal-backdrop" id="launcherModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🎮 게임 모드 & 그리드 선택</div>
        <button class="close-btn" id="closeLauncherBtn" title="닫기">&times;</button>
      </div>

      <div class="launcher-section-title">1. 진화 테마 선택 (7종)</div>
      <div class="theme-cards-grid" id="themeCardsGrid"></div>

      <div class="launcher-section-title">2. 보드 그리드 크기 선택 (난이도)</div>
      <div class="grid-size-selector" id="gridSizeSelector"></div>

      <div class="slot-status-box">
        <div class="slot-status-info" id="slotStatusInfo"></div>
        <div class="launcher-actions" id="launcherActions"></div>
      </div>
    </div>
  </div>

  <!-- Catalog Modal -->
  <div class="modal-backdrop" id="catalogModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="catalogTitle">📖 진화 도감</div>
          <div style="font-size:0.72rem;color:#94a3b8;margin-top:2px;">💡 도감에서 캐릭터 카드를 클릭하면 큰 이미지와 상세 설명 카드를 볼 수 있습니다!</div>
        </div>
        <button class="close-btn" id="closeCatalog">&times;</button>
      </div>
      <div class="catalog-list" id="catalogList"></div>
    </div>
  </div>

  <!-- Character Detail Card Modal -->
  <div class="modal-backdrop" id="itemDetailModal">
    <div class="modal-content detail-card-modal" id="itemDetailCard"></div>
  </div>

    class SoundFx {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      spawn() { this.playTone(480, 'sine', 0.08, 0.09); }
      pickup() { this.playTone(350, 'triangle', 0.06, 0.08); }
      drop() { this.playTone(220, 'sine', 0.06, 0.08); }

      merge(level) {
        if (!this.enabled) return;
        this.init();
        const baseFreq = 220 + ((level % 40) * 22);
        this.playTone(baseFreq, 'triangle', 0.12, 0.18);
        setTimeout(() => {
          this.playTone(baseFreq * 1.33, 'triangle', 0.18, 0.18);
        }, 75);
      }

      trash() { this.playTone(160, 'sawtooth', 0.15, 0.12); }

        if (!this.enabled) return;

          setTimeout(() => this.playTone(freq, 'sine', 0.18, 0.14), i * 85);
        });
      }
    }

    function normalizeBoardTo1D(rawBoard) {
      if (!Array.isArray(rawBoard)) return [];
      if (rawBoard.length > 0 && Array.isArray(rawBoard[0])) {
        const flat = [];
        for (let r = 0; r < rawBoard.length; r++) {
          const row = rawBoard[r];
          if (Array.isArray(row)) {
            for (let c = 0; c < row.length; c++) {
              const cell = row[c];
              if (typeof cell === 'number' && cell > 0) {
                flat.push({ level: cell, id: `item_${Date.now()}_${r}_${c}` });
              } else if (cell && typeof cell === 'object' && cell.level > 0) {
                flat.push(cell);
              } else {
                flat.push(null);
              }
            }
          }
        }
        return flat;
      }
      return rawBoard.map((cell, idx) => {
        if (typeof cell === 'number' && cell > 0) {
          return { level: cell, id: `item_${Date.now()}_${idx}` };
        }
        if (cell && typeof cell === 'object' && cell.level > 0) {
          return cell;
        }
        return null;
      });
    }

    function migrateBoardCells(oldBoardRaw, oldSizeInput, newSizeInput, theme = currentTheme) {
      const newSize = Number(newSizeInput) || 5;
      const newTotal = newSize * newSize;
      const flatOld = normalizeBoardTo1D(oldBoardRaw);
      const inferredOldSize = Math.round(Math.sqrt(flatOld.length)) || Number(oldSizeInput) || newSize;
      const oldSize = (inferredOldSize * inferredOldSize === flatOld.length) ? inferredOldSize : (Number(oldSizeInput) || newSize);

      if (flatOld.length === 0) {
        return { board: Array(newTotal).fill(null), mergedBonusScore: 0, autoMergedCount: 0 };
      }

      if (oldSize === newSize && flatOld.length === newTotal) {
        return { board: flatOld.slice(0, newTotal), mergedBonusScore: 0, autoMergedCount: 0 };
      }

      // Extract non-empty tiles with their (r, c) coordinates
      const extracted = [];
      for (let i = 0; i < flatOld.length; i++) {
        const item = flatOld[i];
        if (item && item.level > 0) {
          const r = Math.floor(i / oldSize);
          const c = i % oldSize;
          extracted.push({
            r,
            c,
            item: { ...item, id: item.id || `item_mig_${Date.now()}_${i}` }
          });
        }
      }

      const newBoard = Array(newTotal).fill(null);
      if (extracted.length === 0) {
        return { board: newBoard, mergedBonusScore: 0, autoMergedCount: 0 };
      }

      // Case 1: Expanding or equal grid (newSize >= oldSize) -> preserve exact (r, c) relative coordinates
      if (newSize >= oldSize) {
        const unplaced = [];
        for (const entry of extracted) {
          if (entry.r < newSize && entry.c < newSize) {
            const targetIdx = entry.r * newSize + entry.c;
            if (newBoard[targetIdx] === null) {
              newBoard[targetIdx] = entry.item;
            } else {
              unplaced.push(entry.item);
            }
          } else {
            unplaced.push(entry.item);
          }
        }
        for (const item of unplaced) {
          const emptyIdx = newBoard.indexOf(null);
          if (emptyIdx !== -1) newBoard[emptyIdx] = item;
        }
        return { board: newBoard, mergedBonusScore: 0, autoMergedCount: 0 };
      }

      // Case 2: Shrinking grid (newSize < oldSize)
      // Reserve at least 1 empty cell when possible so the player can immediately spawn/move, or auto-merge lowest pairs first!
      const maxLvl = THEME_META[theme] ? THEME_META[theme].maxLevel : getMaxLevel();
      const targetCapacity = Math.max(1, newTotal - 1);
      let workingTiles = extracted.map(e => ({ ...e.item, origR: e.r, origC: e.c }));
      let mergedBonusScore = 0;
      let autoMergedCount = 0;

      // Auto-merge matching lowest-level pairs if tile count exceeds targetCapacity
      let mergedAny = true;
      while (workingTiles.length > targetCapacity && mergedAny) {
        mergedAny = false;
        workingTiles.sort((a, b) => a.level - b.level);
        for (let i = 0; i < workingTiles.length - 1; i++) {
          if (workingTiles[i].level === workingTiles[i + 1].level && workingTiles[i].level < maxLvl) {
            const nextLevel = workingTiles[i].level + 1;
            const nextData = getItemData(nextLevel, theme);
            const pts = nextData && nextData.points ? nextData.points : 0;
            mergedBonusScore += pts;
            autoMergedCount++;
            const mergedTile = {
              level: nextLevel,
              id: `item_automerge_${Date.now()}_${autoMergedCount}`,
              isEventAnim: Boolean(workingTiles[i].isEventAnim || workingTiles[i + 1].isEventAnim),
              animType: workingTiles[i].animType || workingTiles[i + 1].animType || 'APNG',
              origR: workingTiles[i].origR,
              origC: workingTiles[i].origC
            };
            workingTiles.splice(i, 2, mergedTile);
            mergedAny = true;
            break;
          }
        }
      }

      // Sort ALL remaining tiles in DESCENDING order of level so highest-stage tiles are 100% prioritized and NEVER lost!
      workingTiles.sort((a, b) => b.level - a.level);

      const selectedTiles = workingTiles.slice(0, newTotal);

      // Place highest-level tiles first: try mapped/clamped coordinate if in bounds, otherwise first empty slot in row-major order
      const leftover = [];
      for (const tile of selectedTiles) {
        const cleanTile = {
          level: tile.level,
          id: tile.id || `item_mig_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          ...(tile.isEventAnim ? { isEventAnim: tile.isEventAnim, animType: tile.animType } : {})
        };
        if (typeof tile.origR === 'number' && typeof tile.origC === 'number' && tile.origR < newSize && tile.origC < newSize) {
          const idx = tile.origR * newSize + tile.origC;
          if (newBoard[idx] === null) {
            newBoard[idx] = cleanTile;
            continue;
          }
        }
        leftover.push(cleanTile);
      }

      for (const tile of leftover) {
        const emptyIdx = newBoard.indexOf(null);
        if (emptyIdx !== -1) {
          newBoard[emptyIdx] = tile;
        }
      }

      return { board: newBoard, mergedBonusScore, autoMergedCount };
    }

    // Migrate legacy save to fruit_5 slot once if needed
    function migrateLegacySave() {
      try {
        const targetKey = getSlotKey('fruit', 5);
        if (localStorage.getItem(targetKey)) return;

        const legacyBoard = localStorage.getItem('taeo_board');
        const legacyScore = localStorage.getItem('taeo_score');
        const legacyBest = localStorage.getItem('taeo_best');
        const legacyUnlocked = localStorage.getItem('taeo_unlocked');

        if (legacyBoard || legacyScore || legacyBest || legacyUnlocked) {
          const parsedBoard = legacyBoard ? JSON.parse(legacyBoard) : Array(25).fill(null);
          const parsedUnlocked = legacyUnlocked ? JSON.parse(legacyUnlocked) : [1];
          const payload = {
            board: Array.isArray(parsedBoard) && parsedBoard.length === 25 ? parsedBoard : Array(25).fill(null),
            gridSize: 5,
            score: parseInt(legacyScore || '0', 10) || 0,
            bestScore: parseInt(legacyBest || '0', 10) || 0,
            maxLevel: Array.isArray(parsedUnlocked) && parsedUnlocked.length > 0 ? Math.max(1, ...parsedUnlocked) : 1,
            unlockedLevels: Array.isArray(parsedUnlocked) && parsedUnlocked.length > 0 ? parsedUnlocked : [1],
            updatedAt: Date.now()
          };
          localStorage.setItem(targetKey, JSON.stringify(payload));
          localStorage.setItem(getThemeUnifiedKey('fruit'), JSON.stringify(payload));

      } catch (e) {
        console.warn('Legacy migration skipped:', e);
      }
    }

    function loadLastConfig() {

        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && THEME_META[parsed.theme] && [4,5,6,7,8].includes(parsed.gridSize)) {
            currentTheme = parsed.theme;
            currentGridSize = parsed.gridSize;
          }
        }
      } catch (e) {}
      selectedLauncherTheme = currentTheme;
      selectedLauncherGrid = currentGridSize;

    function saveLastConfig() {
      try {
        localStorage.setItem('taeo_last_config', JSON.stringify({
          theme: currentTheme,
          gridSize: currentGridSize
        }));
      } catch (e) {}
    }

    function parseSlotPayload(raw, fallbackGridSize = 5) {
      if (!raw) return null;
      try {
        const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (!parsed || !Array.isArray(parsed.board)) return null;
        const flatBoard = normalizeBoardTo1D(parsed.board);
        const inferredGrid = Math.round(Math.sqrt(flatBoard.length)) || parsed.gridSize || fallbackGridSize;
        const boardMaxLvl = flatBoard.reduce((acc, item) => (item && item.level > acc ? item.level : acc), 1);
        const unlockedArr = Array.isArray(parsed.unlockedLevels) ? parsed.unlockedLevels.slice() : [1];
        const savedMaxLvl = Math.max(1, parsed.maxLevel || 1, boardMaxLvl, ...unlockedArr);
        for (let l = 1; l <= savedMaxLvl; l++) {
          if (!unlockedArr.includes(l) && (l === 1 || l === savedMaxLvl || l === boardMaxLvl)) {
            unlockedArr.push(l);
          }
        }
        return {
          ...parsed,
          board: flatBoard,
          gridSize: Number(parsed.gridSize) || inferredGrid,
          score: Number(parsed.score) || 0,
          bestScore: Math.max(Number(parsed.bestScore) || 0, Number(parsed.score) || 0),
          maxLevel: savedMaxLvl,
          unlockedLevels: unlockedArr,
          updatedAt: Number(parsed.updatedAt) || 0
        };
      } catch (e) {
        return null;
      }
    }

    function readDirectSlotData(theme, gridSize) {
      try {
        const raw = localStorage.getItem(getSlotKey(theme, gridSize));
        return parseSlotPayload(raw, gridSize);
      } catch (e) {
        return null;
      }
    }

    function hasMeaningfulProgress(slot) {
      if (!slot || !Array.isArray(slot.board)) return false;
      const nonNullCount = slot.board.filter(x => x !== null).length;
      return nonNullCount > 0 || (slot.score || 0) > 0 || (slot.maxLevel || 1) > 1 || (Array.isArray(slot.unlockedLevels) && slot.unlockedLevels.length > 1);
    }

    // Read best/active save across ALL grid sizes for a theme so changing grid size on Continue seamlessly migrates progress!
    function findBestThemeSave(theme, preferredGridSize = null) {
      const candidates = [];
      const unified = parseSlotPayload(localStorage.getItem(getThemeUnifiedKey(theme)), preferredGridSize || 5);
      if (unified && hasMeaningfulProgress(unified)) {
        candidates.push({ ...unified, sourceGridSize: unified.gridSize || preferredGridSize || 5, isUnified: true });
      }
      for (const g of [4, 5, 6, 7, 8]) {
        const slot = readDirectSlotData(theme, g);
        if (slot && hasMeaningfulProgress(slot)) {
          candidates.push({ ...slot, sourceGridSize: slot.gridSize || g, isUnified: false });
        }
      }
      if (candidates.length === 0) return null;

      const mergedUnlockedSet = new Set([1]);
      let highestBestScore = 0;
      let highestMaxLevel = 1;
      for (const c of candidates) {
        if (c.bestScore > highestBestScore) highestBestScore = c.bestScore;
        if (c.maxLevel > highestMaxLevel) highestMaxLevel = c.maxLevel;
        if (Array.isArray(c.unlockedLevels)) {
          c.unlockedLevels.forEach(lvl => mergedUnlockedSet.add(lvl));
        }
        c.board.forEach(item => {
          if (item && item.level > 0) {
            mergedUnlockedSet.add(item.level);
            if (item.level > highestMaxLevel) highestMaxLevel = item.level;
          }
        });
      }
      mergedUnlockedSet.add(highestMaxLevel);

      candidates.sort((a, b) => {
        const aMax = a.maxLevel || 1;
        const bMax = b.maxLevel || 1;
        const aIsFresh = (aMax <= 1 && (a.score || 0) === 0 && a.board.filter(Boolean).every(x => x.level === 1));
        const bIsFresh = (bMax <= 1 && (b.score || 0) === 0 && b.board.filter(Boolean).every(x => x.level === 1));
        if (aIsFresh !== bIsFresh) return aIsFresh ? 1 : -1;
        if ((b.updatedAt || 0) !== (a.updatedAt || 0)) return (b.updatedAt || 0) - (a.updatedAt || 0);
        if (bMax !== aMax) return bMax - aMax;
        if ((b.score || 0) !== (a.score || 0)) return (b.score || 0) - (a.score || 0);
        if (preferredGridSize && (a.sourceGridSize === preferredGridSize) !== (b.sourceGridSize === preferredGridSize)) {
          return a.sourceGridSize === preferredGridSize ? -1 : 1;
        }
        return 0;
      });

      const chosen = candidates[0];
      return {
        ...chosen,
        bestScore: Math.max(chosen.bestScore || 0, highestBestScore),
        maxLevel: Math.max(chosen.maxLevel || 1, highestMaxLevel),
        unlockedLevels: [...mergedUnlockedSet].sort((a, b) => a - b),
        sourceGridSize: chosen.sourceGridSize || chosen.gridSize || 5
      };
    }

    function readSlotData(theme, gridSize) {
      const direct = readDirectSlotData(theme, gridSize);
      const bestThemeSave = findBestThemeSave(theme, gridSize);
      if (!direct && !bestThemeSave) return null;
      if (direct && bestThemeSave) {
        const directIsFresh = ((direct.maxLevel || 1) <= 1 && (direct.score || 0) === 0 && direct.board.filter(Boolean).every(x => x.level === 1));
        const bestIsProgressed = ((bestThemeSave.maxLevel || 1) > 1 || (bestThemeSave.score || 0) > 0 || bestThemeSave.board.filter(Boolean).some(x => x.level > 1));
        if (directIsFresh && bestIsProgressed) {
          return bestThemeSave;
        }
        if ((bestThemeSave.updatedAt || 0) > (direct.updatedAt || 0)) {
          return bestThemeSave;
        }
        return {
          ...direct,
          bestScore: Math.max(direct.bestScore || 0, bestThemeSave.bestScore || 0),
          maxLevel: Math.max(direct.maxLevel || 1, bestThemeSave.maxLevel || 1),
          unlockedLevels: [...new Set([...(direct.unlockedLevels || [1]), ...(bestThemeSave.unlockedLevels || [1])])].sort((a, b) => a - b),
          sourceGridSize: direct.gridSize || gridSize
        };
      }
      return direct || bestThemeSave;
    }

    function saveState() {
      try {
        const maxU = getMaxUnlockedLevel();
        const payload = {
          board: board,
          gridSize: currentGridSize,
          score: score,
          bestScore: bestScore,
          maxLevel: maxU,
          unlockedLevels: [...unlockedLevels],
          updatedAt: Date.now()
        };
        const serialized = JSON.stringify(payload);
        localStorage.setItem(getSlotKey(currentTheme, currentGridSize), serialized);
        localStorage.setItem(getThemeUnifiedKey(currentTheme), serialized);
        saveLastConfig();
      } catch (e) {}
    }

    function startOrResumeSlot(theme, gridSize, forceReset = false) {
      const prevTheme = currentTheme;
      const prevGridSize = currentGridSize;
      const hasLiveBoardInSameTheme = (!forceReset && prevTheme === theme && Array.isArray(board) && board.some(x => x !== null));

      currentTheme = theme;
      currentGridSize = Number(gridSize) || 5;
      selectedLauncherTheme = currentTheme;
      selectedLauncherGrid = currentGridSize;

      const totalCells = getTotalCells();
      const saved = readSlotData(theme, currentGridSize);

      if (!forceReset && (hasLiveBoardInSameTheme || saved)) {
        let sourceBoard = null;
        let sourceGridSize = currentGridSize;

        // Compare live in-memory board vs saved data if switching grid within the same theme
        if (hasLiveBoardInSameTheme) {
          const liveMax = Math.max(1, getMaxUnlockedLevel(), ...board.filter(Boolean).map(x => x.level || 1));
          const savedMax = saved ? (saved.maxLevel || 1) : 1;
          const liveIsFresh = (liveMax <= 1 && score === 0 && board.filter(Boolean).every(x => x.level === 1));
          const savedIsProgressed = saved && (savedMax > 1 || (saved.score || 0) > 0 || saved.board.filter(Boolean).some(x => x.level > 1));
          if (!saved || (!liveIsFresh && (liveMax >= savedMax || score >= (saved.score || 0))) || !savedIsProgressed) {
            sourceBoard = board.slice();
            sourceGridSize = prevGridSize;
          }
        }

        if (!sourceBoard && saved) {
          sourceBoard = saved.board;
          sourceGridSize = saved.sourceGridSize || saved.gridSize || Math.round(Math.sqrt(saved.board.length)) || currentGridSize;
          score = saved.score || 0;
          bestScore = Math.max(bestScore || 0, saved.bestScore || 0, score);
          unlockedLevels = new Set(Array.isArray(saved.unlockedLevels) && saved.unlockedLevels.length ? saved.unlockedLevels : [1]);
          if (saved.maxLevel && saved.maxLevel > 1) unlockedLevels.add(saved.maxLevel);
        } else if (saved) {
          score = Math.max(score || 0, saved.score || 0);
          bestScore = Math.max(bestScore || 0, saved.bestScore || 0, score);
          if (Array.isArray(saved.unlockedLevels)) {
            saved.unlockedLevels.forEach(lvl => unlockedLevels.add(lvl));
          }
          if (saved.maxLevel && saved.maxLevel > 1) unlockedLevels.add(saved.maxLevel);
        }

        const migration = migrateBoardCells(sourceBoard, sourceGridSize, currentGridSize, currentTheme);
        board = migration.board;
        if (migration.mergedBonusScore > 0) {
          score += migration.mergedBonusScore;
          if (score > bestScore) bestScore = score;
        }
        board.forEach(item => {
          if (item && item.level > 0) unlockedLevels.add(item.level);
        });

        if (sourceGridSize !== currentGridSize) {
          const maxU = getMaxUnlockedLevel();
          setTimeout(() => {
            showToast(`🔄 ${sourceGridSize}x${sourceGridSize} → ${currentGridSize}x${currentGridSize} 그리드 변경 이어하기 완료! (Lv.${maxU} 유지)`);
          }, 120);
        }
      } else {
        bestScore = saved ? (saved.bestScore || 0) : 0;
        score = 0;
        unlockedLevels = new Set([1]);
        board = Array(totalCells).fill(null);
        if (forceReset) {
          try {
            localStorage.removeItem(getThemeUnifiedKey(theme));
            for (const g of [4, 5, 6, 7, 8]) {
              localStorage.removeItem(getSlotKey(theme, g));
            }
          } catch (e) {}
        }
      }

      spawnElapsed = 0;
      initGridDOM();

      const count = board.filter(x => x !== null).length;
      if (count === 0) {
        const startLvl = getMaxUnlockedLevel() > 1 ? Math.max(1, getMaxUnlockedLevel() - 2) : 1;
        spawnRandomItem(startLvl);
        spawnRandomItem(startLvl);
        spawnRandomItem(startLvl);
      }

      updateHeaderUI();
      renderBoard();
      syncViewportLayout();
      syncViewportLayout();
      saveState();
    }

    function changeGridSize(newGridSize) {
      if (![4, 5, 6, 7, 8].includes(Number(newGridSize))) return;
      startOrResumeSlot(currentTheme, Number(newGridSize), false);
    }
    const selectGridSize = changeGridSize;
    const setGridSize = changeGridSize;
    const continueGame = (theme = selectedLauncherTheme, gridSize = selectedLauncherGrid) => startOrResumeSlot(theme, gridSize, false);
    const startGame = (theme = selectedLauncherTheme, gridSize = selectedLauncherGrid, forceReset = false) => startOrResumeSlot(theme, gridSize, forceReset);
    const loadSavedState = readSlotData;
    window.migrateBoardCells = migrateBoardCells;
    window.startOrResumeSlot = startOrResumeSlot;
    window.changeGridSize = changeGridSize;
    window.selectGridSize = selectGridSize;
    window.setGridSize = setGridSize;
    window.continueGame = continueGame;
    window.startGame = startGame;
    window.loadSavedState = loadSavedState;
    window.readSlotData = readSlotData;

    function formatNumber(num) {
      if (num >= 1e16) return (num / 1e16).toFixed(1) + '경';
      if (num >= 1e12) return (num / 1e12).toFixed(1) + '조';
      if (num >= 1e8) return (num / 1e8).toFixed(1) + '억';
      if (num >= 1e4) return (num / 1e4).toFixed(1) + '만';
      return num.toLocaleString();
    }

    /* ============================================================
       4. DYNAMIC SPAWN RANGE LOGIC (MaxUnlocked - 2 ~ MaxUnlocked)
    ============================================================ */
    function getMaxUnlockedLevel() {
      if (!unlockedLevels || unlockedLevels.size === 0) return 1;
      return Math.max(1, ...unlockedLevels);
    }

    function getSpawnLevelRange() {
      const maxUnlocked = getMaxUnlockedLevel();
      const minSpawnLvl = Math.max(1, maxUnlocked - 2);
      const maxSpawnLvl = maxUnlocked;
      return { minSpawnLvl, maxSpawnLvl, maxUnlocked };
    }

    function pickDynamicSpawnLevel() {
      const { minSpawnLvl, maxSpawnLvl, maxUnlocked } = getSpawnLevelRange();
      if (maxUnlocked <= 1) return 1;

      // 12% Jackpot chance to directly spawn current highest unlocked tier M!
      if (Math.random() < 0.12) {
        return maxUnlocked;
      }

      // Remaining 88% distributed across [max(1, M-2) .. M-1]
      const upperNormal = Math.max(1, maxUnlocked - 1);
      if (minSpawnLvl >= upperNormal) return minSpawnLvl;

      const levels = [];
      for (let lvl = minSpawnLvl; lvl <= upperNormal; lvl++) {
        levels.push(lvl);
      }
      const baseWeights = [58, 42];
      const weights = levels.map((_, idx) => baseWeights[idx] || 5);
      const totalWeight = weights.reduce((a, b) => a + b, 0);

      let r = Math.random() * totalWeight;
      for (let i = 0; i < levels.length; i++) {
        if (r < weights[i]) return levels[i];
        r -= weights[i];
      }
      return levels[0];
    }

    /* ============================================================
       5. BOARD RENDERING & IMAGE FALLBACK HANDLING
    ============================================================ */
    const gridBoardEl = document.getElementById('gridBoard');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestScoreDisplay = document.getElementById('bestScoreDisplay');
    const maxLevelDisplay = document.getElementById('maxLevelDisplay');
    const spawnProgressEl = document.getElementById('spawnProgress');
    const spawnTimerText = document.getElementById('spawnTimerText');
    const spawnRangeBadge = document.getElementById('spawnRangeBadge');
    const fullNoticeEl = document.getElementById('fullNotice');
    const trashZoneEl = document.getElementById('trashZone');

    function updateHeaderUI() {
      const meta = THEME_META[currentTheme];
      document.getElementById('subtitleText').textContent = meta.subtitle;
      document.getElementById('modeBadgeBtn').textContent = `⚙️ ${meta.shortName} · ${currentGridSize}x${currentGridSize}`;

    function updateSpawnAndStatUI() {
      const { minSpawnLvl, maxSpawnLvl, maxUnlocked } = getSpawnLevelRange();
      const maxItem = getItemData(maxUnlocked);
      spawnRangeBadge.textContent = `스폰 범위: Lv.${minSpawnLvl} ~ Lv.${maxSpawnLvl}`;

    function initGridDOM() {
      gridBoardEl.innerHTML = '';
      const totalCells = getTotalCells();
      for (let i = 0; i < totalCells; i++) {
        const slot = document.createElement('div');
        slot.className = 'grid-slot';
        slot.dataset.index = i;
