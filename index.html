        subtitle: '고스트 피그·올드 디텍티브·싸이렌 헤드부터 보이드 마더까지 (100단계)',
        desc: '싸이렌 헤드·올드 디텍티브·고스트 피그·카툰 캣·거대 자이언트 100종!',
        previewIcon: '📻',
        previewImg: 'assets/trevor/lv_023.png',
        isImageTheme: true
      },
      weapons: {
        key: 'weapons',
        name: '인류 무기 진화형',
        shortName: '무기형',
        maxLevel: 1000,
        subtitle: '부러진 나뭇가지·돌칼부터 현대 스텔스·극초음속 전략무기까지 (1000단계)',
        desc: '구석기 나뭇가지·반달돌칼·청동검·신기전·전차·전투기·현대 첨단무기 1,000단계!',
        previewIcon: '⚔️',
        previewImg: 'assets/weapons/lv_0011.png',
        isImageTheme: true
      }
    };

    const GRID_OPTIONS = [
      { size: 4, label: '하드' },
      { size: 5, label: '기본' },
      { size: 6, label: '확장' },
      { size: 7, label: '대형' },
      { size: 8, label: '초대형' }
    ];

    const SPAWN_INTERVAL_MS = 3000;

    /* ============================================================
       2. AUDIO SYNTHESIZER (Web Audio API)
    ============================================================ */
    class SoundFx {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      spawn() { this.playTone(480, 'sine', 0.08, 0.09); }
      pickup() { this.playTone(350, 'triangle', 0.06, 0.08); }
      drop() { this.playTone(220, 'sine', 0.06, 0.08); }

      merge(level) {
        if (!this.enabled) return;
        this.init();
        const baseFreq = 220 + ((level % 40) * 22);
        this.playTone(baseFreq, 'triangle', 0.12, 0.18);
        setTimeout(() => {
          this.playTone(baseFreq * 1.33, 'triangle', 0.18, 0.18);
        }, 75);
      }

      trash() { this.playTone(160, 'sawtooth', 0.15, 0.12); }

      unlocked() {
        if (!this.enabled) return;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.18, 0.14), i * 85);
        });
      }
    }

    const sound = new SoundFx();

    /* ============================================================
       3. DYNAMIC STATE & LOCAL STORAGE (Per Theme x Grid Size)
    ============================================================ */
    let currentTheme = 'fruit';
    let currentGridSize = 5;
    let selectedLauncherTheme = 'fruit';
    let selectedLauncherGrid = 5;

    let board = [];
    let score = 0;
    let bestScore = 0;
    let unlockedLevels = new Set([1]);
    let spawnElapsed = 0;
    let lastTime = performance.now();
    let isDragging = false;

    function getTotalCells() {
      return currentGridSize * currentGridSize;
    }

    function getMaxLevel() {
      return THEME_META[currentTheme].maxLevel;
    }

    function getEvolutionTree(theme = currentTheme) {
      return THEME_DATA[theme] || THEME_DATA.fruit;
    }

    function getItemData(level, theme = currentTheme) {
      const tree = getEvolutionTree(theme);
      return tree.find(item => item.level === level) || tree[0];
    }

    function getSlotKey(theme, gridSize) {
      return `taeo_save_${theme}_${gridSize}`;
    }

    // Migrate legacy save to fruit_5 slot once if needed
    function migrateLegacySave() {
      try {
        const targetKey = getSlotKey('fruit', 5);
        if (localStorage.getItem(targetKey)) return;

        const legacyBoard = localStorage.getItem('taeo_board');
        const legacyScore = localStorage.getItem('taeo_score');
        const legacyBest = localStorage.getItem('taeo_best');
        const legacyUnlocked = localStorage.getItem('taeo_unlocked');

        if (legacyBoard || legacyScore || legacyBest || legacyUnlocked) {
          const parsedBoard = legacyBoard ? JSON.parse(legacyBoard) : Array(25).fill(null);
          const parsedUnlocked = legacyUnlocked ? JSON.parse(legacyUnlocked) : [1];
          const payload = {
            board: Array.isArray(parsedBoard) && parsedBoard.length === 25 ? parsedBoard : Array(25).fill(null),
            score: parseInt(legacyScore || '0', 10) || 0,
            bestScore: parseInt(legacyBest || '0', 10) || 0,
            unlockedLevels: Array.isArray(parsedUnlocked) && parsedUnlocked.length > 0 ? parsedUnlocked : [1],
            updatedAt: Date.now()
          };
          localStorage.setItem(targetKey, JSON.stringify(payload));
        }
      } catch (e) {
        console.warn('Legacy migration skipped:', e);
      }
    }

    function loadLastConfig() {
      try {
        const raw = localStorage.getItem('taeo_last_config');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && THEME_META[parsed.theme] && [4,5,6,7,8].includes(parsed.gridSize)) {
            currentTheme = parsed.theme;
            currentGridSize = parsed.gridSize;
          }
        }
      } catch (e) {}
      selectedLauncherTheme = currentTheme;
      selectedLauncherGrid = currentGridSize;
    }

    function saveLastConfig() {
      try {
        localStorage.setItem('taeo_last_config', JSON.stringify({
          theme: currentTheme,
          gridSize: currentGridSize
        }));
      } catch (e) {}
    }

    function readSlotData(theme, gridSize) {
      try {
        const raw = localStorage.getItem(getSlotKey(theme, gridSize));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.board)) return null;
        return parsed;
      } catch (e) {
        return null;
      }
    }

    function saveState() {
      try {
        const payload = {
          board: board,
          score: score,
          bestScore: bestScore,
          unlockedLevels: [...unlockedLevels],
          updatedAt: Date.now()
        };
        localStorage.setItem(getSlotKey(currentTheme, currentGridSize), JSON.stringify(payload));
        saveLastConfig();
      } catch (e) {}
    }

    function startOrResumeSlot(theme, gridSize, forceReset = false) {
      currentTheme = theme;
      currentGridSize = gridSize;
      const totalCells = getTotalCells();
      const saved = readSlotData(theme, gridSize);

      if (saved && !forceReset) {
        score = saved.score || 0;
        bestScore = saved.bestScore || 0;
        unlockedLevels = new Set(Array.isArray(saved.unlockedLevels) && saved.unlockedLevels.length ? saved.unlockedLevels : [1]);
        if (Array.isArray(saved.board) && saved.board.length === totalCells) {
          board = saved.board;
        } else {
          board = Array(totalCells).fill(null);
        }
      } else {
        bestScore = saved ? (saved.bestScore || 0) : 0;
        score = 0;
        unlockedLevels = new Set([1]);
        board = Array(totalCells).fill(null);
      }

      spawnElapsed = 0;
      initGridDOM();

      const count = board.filter(x => x !== null).length;
      if (count === 0) {
        spawnRandomItem(1);
        spawnRandomItem(1);
        spawnRandomItem(1);
      }

      updateHeaderUI();
      renderBoard();
      syncViewportLayout();
      syncViewportLayout();
      saveState();
    }

    function formatNumber(num) {
      if (num >= 1e16) return (num / 1e16).toFixed(1) + '경';
      if (num >= 1e12) return (num / 1e12).toFixed(1) + '조';
      if (num >= 1e8) return (num / 1e8).toFixed(1) + '억';
      if (num >= 1e4) return (num / 1e4).toFixed(1) + '만';
      return num.toLocaleString();
    }

    /* ============================================================
       4. DYNAMIC SPAWN RANGE LOGIC (MaxUnlocked - 2 ~ MaxUnlocked)
    ============================================================ */
    function getMaxUnlockedLevel() {
      if (!unlockedLevels || unlockedLevels.size === 0) return 1;
      return Math.max(1, ...unlockedLevels);
    }

    function getSpawnLevelRange() {
      const maxUnlocked = getMaxUnlockedLevel();
      const minSpawnLvl = Math.max(1, maxUnlocked - 2);
      const maxSpawnLvl = maxUnlocked;
      return { minSpawnLvl, maxSpawnLvl, maxUnlocked };
    }

    function pickDynamicSpawnLevel() {
      const { minSpawnLvl, maxSpawnLvl, maxUnlocked } = getSpawnLevelRange();
      if (maxUnlocked <= 1) return 1;

      // 12% Jackpot chance to directly spawn current highest unlocked tier M!
      if (Math.random() < 0.12) {
        return maxUnlocked;
      }

      // Remaining 88% distributed across [max(1, M-2) .. M-1]
      const upperNormal = Math.max(1, maxUnlocked - 1);
      if (minSpawnLvl >= upperNormal) return minSpawnLvl;

      const levels = [];
      for (let lvl = minSpawnLvl; lvl <= upperNormal; lvl++) {
        levels.push(lvl);
      }
      const baseWeights = [58, 42];
      const weights = levels.map((_, idx) => baseWeights[idx] || 5);
      const totalWeight = weights.reduce((a, b) => a + b, 0);

      let r = Math.random() * totalWeight;
      for (let i = 0; i < levels.length; i++) {
        if (r < weights[i]) return levels[i];
        r -= weights[i];
      }
      return levels[0];
    }

    /* ============================================================
       5. BOARD RENDERING & IMAGE FALLBACK HANDLING
    ============================================================ */
    const gridBoardEl = document.getElementById('gridBoard');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestScoreDisplay = document.getElementById('bestScoreDisplay');
    const maxLevelDisplay = document.getElementById('maxLevelDisplay');
    const spawnProgressEl = document.getElementById('spawnProgress');
    const spawnTimerText = document.getElementById('spawnTimerText');
    const spawnRangeBadge = document.getElementById('spawnRangeBadge');
    const fullNoticeEl = document.getElementById('fullNotice');
    const trashZoneEl = document.getElementById('trashZone');

    function updateHeaderUI() {
      const meta = THEME_META[currentTheme];
      document.getElementById('subtitleText').textContent = meta.subtitle;
      document.getElementById('modeBadgeBtn').textContent = `⚙️ ${meta.shortName} · ${currentGridSize}x${currentGridSize}`;
      gridBoardEl.dataset.grid = String(currentGridSize);
      gridBoardEl.style.gridTemplateColumns = `repeat(${currentGridSize}, 1fr)`;
      gridBoardEl.style.gridTemplateRows = `repeat(${currentGridSize}, 1fr)`;
    }

    function updateSpawnAndStatUI() {
      const { minSpawnLvl, maxSpawnLvl, maxUnlocked } = getSpawnLevelRange();
      const maxItem = getItemData(maxUnlocked);
      spawnRangeBadge.textContent = `스폰 범위: Lv.${minSpawnLvl} ~ Lv.${maxSpawnLvl}`;
      maxLevelDisplay.textContent = `Lv.${maxUnlocked} ${maxItem ? maxItem.name : ''}`;
      scoreDisplay.textContent = formatNumber(score);
      bestScoreDisplay.textContent = formatNumber(bestScore);
    }

    function initGridDOM() {
      gridBoardEl.innerHTML = '';
      const totalCells = getTotalCells();
      for (let i = 0; i < totalCells; i++) {
        const slot = document.createElement('div');
        slot.className = 'grid-slot';
        slot.dataset.index = i;
        gridBoardEl.appendChild(slot);
      }
    }

    function getFallbackContent(data, theme = currentTheme) {
      if (theme === 'elements') {
        return `<div class="item-fallback">${data.symbol || '⚛️'}</div>`;
      }
      if (theme === 'pokemon') {
        return `<div class="item-fallback">🔴</div>`;
      }
      if (theme === 'robots') {
        return `<div class="item-fallback">🤖</div>`;
      }
      return `<span class="item-icon">${data.icon || '⭐'}</span>`;
    }

    function buildTileInnerHTML(data, theme = currentTheme, itemObj = null) {
      const meta = THEME_META[theme];
      const isEventAnim = Boolean(itemObj && itemObj.isEventAnim);
      const animFmt = (itemObj && itemObj.animType) || 'APNG';

      let rightBadge = '';
      if (theme === 'elements' && data.symbol) {
        rightBadge = `<span class="item-badge-right">${data.symbol}</span>`;
      } else if (theme === 'pokemon' && data.pokedex_id) {
        rightBadge = `<span class="item-badge-right">#${String(data.pokedex_id).padStart(3, '0')}</span>`;
      } else if (theme === 'scp' && data.scp_id) {
        rightBadge = `<span class="item-badge-right">${data.scp_id}</span>`;
      } else if ((theme === 'trevor' || theme === 'weapons') && data.badge) {
        rightBadge = `<span class="item-badge-right">${data.badge}</span>`;
      }

      const eventOverlayHTML = isEventAnim
        ? `<img class="event-aura-overlay" src="assets/events/event_${theme}_aura.apng" alt="APNG Aura" onerror="this.style.display='none';" />
           <span class="event-format-tag">🎬 ${animFmt} 2X</span>`
        : '';

      let visualHTML = '';
      if (meta.isImageTheme && data.image) {
        const fallbackSym = theme === 'elements'
          ? (data.symbol || '⚛️')
          : (theme === 'robots' ? '🤖' : (theme === 'scp' ? '☣️' : (theme === 'trevor' ? '📻' : (theme === 'weapons' ? '⚔️' : '🔴'))));
        // If Pokemon + GIF event spawn, load official animated GIF sprite with fallback to PNG!
        const primaryImgSrc = (isEventAnim && theme === 'pokemon' && animFmt === 'GIF' && data.pokedex_id)
          ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${data.pokedex_id}.gif`
          : data.image;
        visualHTML = `
          ${eventOverlayHTML}
          <img class="item-img" ${getDriveAtlasAttrs(primaryImgSrc, 'z-index:2;')} alt="${data.name}"
               onerror="if(this.getAttribute('src') !== BLANK_GIF && typeof applyDriveAtlasToImg === 'function' && location.protocol !== 'file:'){ this.setAttribute('src', '${data.image}'); applyDriveAtlasToImg(this); } else if(this.src !== '${data.image}' && location.protocol === 'file:'){ this.src='${data.image}'; } else { this.style.display='none'; this.nextElementSibling.style.display='flex'; }" />
          <div class="item-fallback" style="display:none;z-index:2;">${fallbackSym}</div>
        `;
      } else {
        visualHTML = `
          ${eventOverlayHTML}
          <span class="item-icon" style="z-index:2;">${data.icon || '🍒'}</span>
        `;
      }

      return `
        <span class="item-level">Lv.${data.level}</span>
        ${rightBadge}
        ${visualHTML}
        <span class="item-name">${data.name}</span>
      `;
    }

    function renderBoard(animateIndex = -1, isJackpotSpawn = false) {
      const slots = gridBoardEl.children;
      const totalCells = getTotalCells();
      const maxLvl = getMaxLevel();
      let hasEmpty = false;

      for (let i = 0; i < totalCells; i++) {
        const slot = slots[i];
        if (!slot) continue;
        slot.innerHTML = '';
        const item = board[i];

        if (item) {
          const data = getItemData(item.level);
          const tile = document.createElement('div');
          const cosmicClass = data.level === maxLvl ? 'tier-max-cosmic' : '';
          tile.className = `item-tile tier-${data.level <= 120 ? data.level : (((data.level - 21) % 100) + 21)} ${cosmicClass}`;
          if (i === animateIndex) {
            tile.classList.add(isJackpotSpawn ? 'lucky-jackpot' : 'merge-pop');
          }
          tile.dataset.index = i;
          tile.dataset.level = item.level;
          if (item.isEventAnim) tile.classList.add('event-anim-tile');
          tile.innerHTML = buildTileInnerHTML(data, currentTheme, item);

          attachDragEvents(tile, i);
          slot.appendChild(tile);
        } else {
          hasEmpty = true;
        }
      }

      fullNoticeEl.style.display = hasEmpty ? 'none' : 'block';
      updateSpawnAndStatUI();
    }

    // Periodically retry any broken images that might still be generating in background
    setInterval(() => {
      const brokenImgs = document.querySelectorAll('img.item-img[style*="display: none"], .catalog-icon img[style*="display: none"]');
      brokenImgs.forEach(img => {
        const baseSrc = img.getAttribute('data-src');
        if (baseSrc) {
          const testImg = new Image();
          testImg.onload = () => {
            img.src = baseSrc + '?t=' + Date.now();
            img.style.display = '';
            if (img.nextElementSibling) img.nextElementSibling.style.display = 'none';
          };
          testImg.src = baseSrc + '?t=' + Date.now();
        }
      });
    }, 4000);

    function findEmptySlots() {
      const empty = [];
      const totalCells = getTotalCells();
      for (let i = 0; i < totalCells; i++) {
        if (board[i] === null) empty.push(i);
      }
      return empty;
    }

    function spawnRandomItem(forceLevel = null) {
      const emptySlots = findEmptySlots();
      if (emptySlots.length === 0) return false;

      const maxUnlockedBefore = getMaxUnlockedLevel();
      const randomIndex = emptySlots[Math.floor(Math.random() * emptySlots.length)];
      const lvl = forceLevel !== null ? forceLevel : pickDynamicSpawnLevel();
      const isJackpot = forceLevel === null && maxUnlockedBefore > 1 && lvl === maxUnlockedBefore;
      const isEventAnim = isJackpot || (forceLevel === null && Math.random() < 0.15);
      const animType = (currentTheme === 'pokemon' || Math.random() < 0.5) ? 'GIF' : 'APNG';

      board[randomIndex] = {
        level: lvl,
        id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        isEventAnim: isEventAnim,
        animType: animType
      };

      if (!unlockedLevels.has(lvl)) {
        unlockedLevels.add(lvl);
      }

      if (isJackpot) {
        const data = getItemData(lvl);
        sound.unlocked();
        showToast(`🎬 [${animType} 이벤트 잭팟!] 최고 등급 Lv.${lvl} ${data ? data.name : ''} (병합 점수 2배!)`);
      } else if (isEventAnim) {
        const data = getItemData(lvl);
        sound.spawn();
        showToast(`✨ [${animType} 애니메이션 이벤트 스폰!] Lv.${lvl} ${data ? data.name : ''} (2X 보너스)`);
      } else {
        sound.spawn();
      }

      renderBoard(randomIndex, isJackpot);
      saveState();
      return true;
    }

    /* ============================================================
       6. DRAG & DROP ENGINE (POINTER EVENTS)
    ============================================================ */
    let activeDrag = null;
    let dragCloneEl = null;

    function attachDragEvents(tileEl, cellIndex) {
      tileEl.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        sound.init();

        const item = board[cellIndex];
        if (!item) return;

        isDragging = true;
        const rect = tileEl.getBoundingClientRect();

        activeDrag = {
          fromIndex: cellIndex,
          item: item,
          startX: e.clientX,
          startY: e.clientY
        };

        const data = getItemData(item.level);
        const cosmicClass = data.level === getMaxLevel() ? 'tier-max-cosmic' : '';
        dragCloneEl = document.createElement('div');
        dragCloneEl.className = `drag-clone tier-${data.level <= 120 ? data.level : (((data.level - 21) % 100) + 21)} ${cosmicClass}`;
        dragCloneEl.style.width = rect.width + 'px';
        dragCloneEl.style.height = rect.height + 'px';
        dragCloneEl.style.left = e.clientX + 'px';
        dragCloneEl.style.top = e.clientY + 'px';
        dragCloneEl.innerHTML = tileEl.innerHTML;
        document.body.appendChild(dragCloneEl);

        tileEl.style.opacity = '0.3';
        sound.pickup();

        const onPointerMove = (moveEvent) => {
          if (!activeDrag || !dragCloneEl) return;
          dragCloneEl.style.left = moveEvent.clientX + 'px';
          dragCloneEl.style.top = moveEvent.clientY + 'px';

          highlightDropTarget(moveEvent.clientX, moveEvent.clientY);
        };

        const onPointerUp = (upEvent) => {
          document.removeEventListener('pointermove', onPointerMove);
          document.removeEventListener('pointerup', onPointerUp);

          if (dragCloneEl) {
            dragCloneEl.remove();
            dragCloneEl = null;
          }

          if (activeDrag) {
            handleDrop(upEvent.clientX, upEvent.clientY);
            clearHighlights();
            activeDrag = null;
            isDragging = false;
          }
        };

        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
      });
    }

    function clearHighlights() {
      const slots = document.querySelectorAll('.grid-slot');
      slots.forEach(s => {
        s.classList.remove('drag-over-empty', 'drag-over-merge', 'drag-over-swap');
      });
      trashZoneEl.classList.remove('drag-over');
    }

    function highlightDropTarget(clientX, clientY) {
      clearHighlights();

      const trashRect = trashZoneEl.getBoundingClientRect();
      if (
        clientX >= trashRect.left && clientX <= trashRect.right &&
        clientY >= trashRect.top && clientY <= trashRect.bottom
      ) {
        trashZoneEl.classList.add('drag-over');
        return;
      }

      const elUnder = document.elementFromPoint(clientX, clientY);
      if (!elUnder) return;

      const slot = elUnder.closest('.grid-slot');
      if (!slot) return;

      const toIndex = parseInt(slot.dataset.index, 10);
      if (toIndex === activeDrag.fromIndex) return;

      const targetItem = board[toIndex];
      if (!targetItem) {
        slot.classList.add('drag-over-empty');
      } else if (targetItem.level === activeDrag.item.level && activeDrag.item.level < getMaxLevel()) {
        slot.classList.add('drag-over-merge');
      } else {
        slot.classList.add('drag-over-swap');
      }
    }

    function handleDrop(clientX, clientY) {
      if (!activeDrag) return;
      const { fromIndex, item } = activeDrag;

      // 1. Trash drop
      const trashRect = trashZoneEl.getBoundingClientRect();
      if (
        clientX >= trashRect.left && clientX <= trashRect.right &&
        clientY >= trashRect.top && clientY <= trashRect.bottom
      ) {
        board[fromIndex] = null;
        sound.trash();
        renderBoard();
        saveState();
        return;
      }

      // 2. Slot drop
      const elUnder = document.elementFromPoint(clientX, clientY);
      const slot = elUnder ? elUnder.closest('.grid-slot') : null;

      if (!slot) {
        renderBoard();
        return;
      }

      const toIndex = parseInt(slot.dataset.index, 10);
      if (toIndex === fromIndex) {
        renderBoard();
        return;
      }

      const targetItem = board[toIndex];

      // A. Empty slot -> Move
      if (!targetItem) {
        board[toIndex] = item;
        board[fromIndex] = null;
        sound.drop();
        renderBoard();
        saveState();
      }
      // B. Same Level -> MERGE!
      else if (targetItem.level === item.level && item.level < getMaxLevel()) {
        const nextLevel = item.level + 1;
        const nextData = getItemData(nextLevel);

        board[toIndex] = {
          level: nextLevel,
          id: 'item_' + Date.now()
        };
        board[fromIndex] = null;

        const isBonusMerge = Boolean(item.isEventAnim || targetItem.isEventAnim);
        const earnedPts = isBonusMerge ? nextData.points * 2 : nextData.points;
        addScore(earnedPts);
        sound.merge(nextLevel);

        if (!unlockedLevels.has(nextLevel)) {
          unlockedLevels.add(nextLevel);
          sound.unlocked();
          const badge = nextData.icon || (nextData.symbol ? `[${nextData.symbol}]` : '🎉');
          showToast(`새로운 도감 해금! [Lv.${nextLevel} ${nextData.name}] ${badge}`);
        }

        renderBoard(toIndex);
        saveState();
      }
      // C. Max Level or Different Level -> Swap
      else {
        board[toIndex] = item;
        board[fromIndex] = targetItem;
        sound.drop();
        renderBoard();
        saveState();
      }
    }

    function addScore(points) {
      score += points;
      if (score > bestScore) {
        bestScore = score;
      }
      updateSpawnAndStatUI();
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    /* ============================================================
       7. GAME LOOP & SPAWN TIMER
    ============================================================ */
    const launcherModal = document.getElementById('launcherModal');
    const catalogModal = document.getElementById('catalogModal');
    const itemDetailModal = document.getElementById('itemDetailModal');
    const itemDetailCard = document.getElementById('itemDetailCard');

    function isAnyModalOpen() {
      return (
        launcherModal.style.display === 'flex' ||
        catalogModal.style.display === 'flex' ||
        itemDetailModal.style.display === 'flex'
      );
    }

    function gameLoop(now) {
      const delta = now - lastTime;
      lastTime = now;

      const hasEmpty = findEmptySlots().length > 0;
      if (hasEmpty && !isAnyModalOpen()) {
        spawnElapsed += delta;
        if (spawnElapsed >= SPAWN_INTERVAL_MS) {
          spawnElapsed = 0;
          spawnRandomItem();
        }
      }

      const progressRatio = Math.min(1, spawnElapsed / SPAWN_INTERVAL_MS);
      spawnProgressEl.style.width = (progressRatio * 100) + '%';
      const remainingSec = Math.max(0, ((SPAWN_INTERVAL_MS - spawnElapsed) / 1000)).toFixed(1);
      spawnTimerText.textContent = hasEmpty ? `${remainingSec}초` : '보드 가득참';

      requestAnimationFrame(gameLoop);
    }

    /* ============================================================
       8. LAUNCHER MODAL (Theme & Grid Selection + Resume / New Game)
    ============================================================ */
    const themeCardsGrid = document.getElementById('themeCardsGrid');
    const gridSizeSelector = document.getElementById('gridSizeSelector');
    const slotStatusInfo = document.getElementById('slotStatusInfo');
    const launcherActions = document.getElementById('launcherActions');

    function renderLauncherModal() {
      // 1. Render Theme Cards
      themeCardsGrid.innerHTML = '';
      Object.values(THEME_META).forEach(meta => {
        const card = document.createElement('div');
        card.className = `theme-card ${selectedLauncherTheme === meta.key ? 'active' : ''}`;
        const previewHTML = meta.previewImg
          ? `<img ${getDriveAtlasAttrs(meta.previewImg)} alt="${meta.name}" onerror="this.style.display='none'; this.parentElement.textContent='${meta.previewIcon}';" />`
          : meta.previewIcon;

        card.innerHTML = `
          <div class="theme-card-top">
            <div class="theme-card-preview">${previewHTML}</div>
            <div>
              <div class="theme-card-title">${meta.name}</div>
              <div class="theme-card-stages">총 ${meta.maxLevel}단계 진화</div>
            </div>
          </div>
          <div class="theme-card-desc">${meta.desc}</div>
        `;
        card.addEventListener('click', () => {
          selectedLauncherTheme = meta.key;
          renderLauncherModal();
        });
        themeCardsGrid.appendChild(card);
      });

      // 2. Render Grid Size Buttons
      gridSizeSelector.innerHTML = '';
      GRID_OPTIONS.forEach(opt => {
        const saved = readSlotData(selectedLauncherTheme, opt.size);
        const hasSave = saved && Array.isArray(saved.board) && saved.board.some(x => x !== null);
        const maxLvl = saved && Array.isArray(saved.unlockedLevels) ? Math.max(1, ...saved.unlockedLevels) : 1;

        const btn = document.createElement('button');
        btn.className = `grid-size-btn ${selectedLauncherGrid === opt.size ? 'active' : ''}`;
        btn.innerHTML = `
          <span class="g-dim">${opt.size}x${opt.size}</span>
          <span class="g-label">${opt.label}${hasSave ? ` · Lv.${maxLvl}` : ''}</span>
        `;
        btn.addEventListener('click', () => {
          selectedLauncherGrid = opt.size;
          renderLauncherModal();
        });
        gridSizeSelector.appendChild(btn);
      });

      // 3. Render Slot Save Status & Action Buttons
      const meta = THEME_META[selectedLauncherTheme];
      const saved = readSlotData(selectedLauncherTheme, selectedLauncherGrid);
      const hasProgress = saved && Array.isArray(saved.board) && (saved.board.some(x => x !== null) || (saved.score || 0) > 0 || (saved.unlockedLevels && saved.unlockedLevels.length > 1));

      launcherActions.innerHTML = '';

      if (hasProgress) {
        const maxU = Math.max(1, ...(saved.unlockedLevels || [1]));
        const maxItem = getItemData(maxU, selectedLauncherTheme);
        slotStatusInfo.innerHTML = `
          <span>💾 <strong>${meta.shortName} (${selectedLauncherGrid}x${selectedLauncherGrid})</strong> 저장된 게임 있음</span>
          <span style="color:#38bdf8;font-weight:700;">점수: ${formatNumber(saved.score || 0)} / 최고 달성: Lv.${maxU} ${maxItem ? maxItem.name : ''}</span>
        `;

        const resumeBtn = document.createElement('button');
        resumeBtn.className = 'launcher-btn primary';
        resumeBtn.innerHTML = `▶️ 이어하기 (Lv.${maxU} · ${formatNumber(saved.score || 0)}점)`;
        resumeBtn.addEventListener('click', () => {
          sound.init();
          startOrResumeSlot(selectedLauncherTheme, selectedLauncherGrid, false);
          launcherModal.style.display = 'none';
        });

        const restartBtn = document.createElement('button');
        restartBtn.className = 'launcher-btn danger';
        restartBtn.innerHTML = `🔄 처음부터 새로 시작`;
        restartBtn.addEventListener('click', () => {
          sound.init();
          startOrResumeSlot(selectedLauncherTheme, selectedLauncherGrid, true);
          launcherModal.style.display = 'none';
        });

        launcherActions.appendChild(resumeBtn);
        launcherActions.appendChild(restartBtn);
      } else {
        slotStatusInfo.innerHTML = `
          <span>✨ <strong>${meta.shortName} (${selectedLauncherGrid}x${selectedLauncherGrid})</strong> 새로운 게임 슬롯</span>
          <span style="color:#94a3b8;">Lv.1부터 진화를 시작합니다</span>
        `;

        const startBtn = document.createElement('button');
        startBtn.className = 'launcher-btn primary';
        startBtn.innerHTML = `▶️ 게임 시작하기 (${meta.shortName} · ${selectedLauncherGrid}x${selectedLauncherGrid})`;
        startBtn.addEventListener('click', () => {
          sound.init();
          startOrResumeSlot(selectedLauncherTheme, selectedLauncherGrid, false);
          launcherModal.style.display = 'none';
        });

        const freshBtn = document.createElement('button');
        freshBtn.className = 'launcher-btn secondary';
        freshBtn.innerHTML = `🔄 처음부터 새로 시작`;
        freshBtn.addEventListener('click', () => {
          sound.init();
          startOrResumeSlot(selectedLauncherTheme, selectedLauncherGrid, true);
          launcherModal.style.display = 'none';
        });

        launcherActions.appendChild(startBtn);
        launcherActions.appendChild(freshBtn);
      }
    }

    function openLauncherModal() {
      selectedLauncherTheme = currentTheme;
      selectedLauncherGrid = currentGridSize;
      renderLauncherModal();
      launcherModal.style.display = 'flex';
    }

    document.getElementById('homeBtn').addEventListener('click', openLauncherModal);
    document.getElementById('modeBadgeBtn').addEventListener('click', openLauncherModal);
    document.getElementById('closeLauncherBtn').addEventListener('click', () => {
      launcherModal.style.display = 'none';
    });
    launcherModal.addEventListener('click', (e) => {
      if (e.target === launcherModal) launcherModal.style.display = 'none';
    });

    /* ============================================================
       9. BUTTON LISTENERS & CATALOG MODAL
    ============================================================ */
    document.getElementById('spawnNowBtn').addEventListener('click', () => {
      sound.init();
      if (spawnRandomItem()) {
        spawnElapsed = 0;
      }
    });

    document.getElementById('purgeLowSpawnBtn').addEventListener('click', () => {
      sound.init();
      const { minSpawnLvl } = getSpawnLevelRange();
      let removedCount = 0;
      for (let i = 0; i < board.length; i++) {
        if (board[i] && board[i].level < minSpawnLvl) {
          board[i] = null;
          removedCount++;
        }
      }
      if (removedCount > 0) {
        sound.trash();
        renderBoard();
        saveState();
        showToast(`🧹 스폰 범위(Lv.${minSpawnLvl}) 미만 하위 스폰 ${removedCount}개 일괄 제거 완료!`);
      } else {
        sound.pickup();
        showToast(`✨ 현재 보드에 스폰 범위(Lv.${minSpawnLvl}) 미만의 하위 스폰이 없습니다.`);
      }
    });

    function syncViewportLayout() {
      const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const wrapper = document.querySelector('.game-wrapper');
      const boardContainer = document.querySelector('.board-container');
      const headerEl = document.querySelector('.game-header');
      const statsEl = document.querySelector('.stats-row');
      const spawnEl = document.querySelector('.spawn-bar-wrapper');
      const bottomEl = document.querySelector('.bottom-bar');
      if (!wrapper || !boardContainer || !gridBoardEl) return;

      const isShortLandscape = (vw > vh * 1.15) && (vh <= 680);
      const isMobilePortrait = !isShortLandscape && (vw <= 540);
      const isCompact = isMobilePortrait || (vh < 780) || (vw < 540);

      wrapper.dataset.compact = isCompact ? 'true' : 'false';
      wrapper.dataset.mobile = isMobilePortrait ? 'true' : 'false';
      wrapper.dataset.layout = isShortLandscape ? 'landscape' : 'portrait';

      // Force synchronous style/layout reflow so offsetHeight reflects compact/mobile rules
      void wrapper.offsetHeight;

      const padExtra = isCompact ? 12 : 20;
      let side = 300;

      if (isShortLandscape) {
        const maxBoardH = Math.max(160, Math.floor(vh - 28));
        const maxBoardW = Math.max(160, Math.floor(vw - 270));
        side = Math.min(maxBoardH, maxBoardW, 540);
      } else if (isMobilePortrait) {
        const nonBoardH =
          (headerEl ? headerEl.offsetHeight : 34) +
          (statsEl ? statsEl.offsetHeight : 38) +
          (spawnEl ? spawnEl.offsetHeight : 58) +
          (bottomEl ? bottomEl.offsetHeight : 30) +
          42;
        const availH = Math.max(180, Math.floor(vh - nonBoardH));
        const availW = Math.max(180, Math.floor(vw - 28));
        side = Math.min(availW, availH, 520);
      } else {
        const maxWrapperW = vw >= 900 ? 640 : Math.min(600, vw - 16);
        wrapper.style.maxWidth = maxWrapperW + 'px';
        const nonBoardH =
          (headerEl ? headerEl.offsetHeight : 44) +
          (statsEl ? statsEl.offsetHeight : 50) +
          (spawnEl ? spawnEl.offsetHeight : 54) +
          (bottomEl ? bottomEl.offsetHeight : 38) +
          (isCompact ? 48 : 76);
        const availH = Math.max(200, Math.floor(vh - nonBoardH));
        const availW = Math.max(200, Math.floor(maxWrapperW - (isCompact ? 32 : 48)));
        side = Math.min(availW, availH, 560);
      }

      const cellPx = Math.floor(side / currentGridSize);
      const gapPx = cellPx < 44 ? 3 : (cellPx < 58 ? 5 : 7);
      gridBoardEl.style.setProperty('--cell-size', cellPx + 'px');
      gridBoardEl.style.gap = gapPx + 'px';
      gridBoardEl.dataset.smallCell = cellPx < 44 ? 'true' : 'false';

      gridBoardEl.style.width = side + 'px';
      gridBoardEl.style.height = side + 'px';
      boardContainer.style.width = (side + padExtra) + 'px';
      boardContainer.style.margin = '0 auto';
    }

    window.addEventListener('resize', syncViewportLayout);
    window.addEventListener('orientationchange', () => setTimeout(syncViewportLayout, 60));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewportLayout);
    }
    setTimeout(syncViewportLayout, 0);

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundBtn.textContent = sound.enabled ? '🔊' : '🔇';
    });

    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      const meta = THEME_META[currentTheme];
      if (confirm(`[${meta.shortName} ${currentGridSize}x${currentGridSize}] 슬롯을 처음부터 다시 시작하시겠습니까?\n(현재 보드와 점수가 초기화됩니다)`)) {
        startOrResumeSlot(currentTheme, currentGridSize, true);
      }
    });

    const catalogList = document.getElementById('catalogList');
    const catalogTitle = document.getElementById('catalogTitle');
    const bookBtn = document.getElementById('bookBtn');
    const closeCatalog = document.getElementById('closeCatalog');

    function renderCatalog() {
      catalogList.innerHTML = '';
      const meta = THEME_META[currentTheme];
      const tree = getEvolutionTree(currentTheme);
      catalogTitle.textContent = `📖 ${meta.name} 진화 도감 (총 ${meta.maxLevel}단계 · 해금 ${unlockedLevels.size}/${meta.maxLevel})`;

      // Group items by series in order of appearance
      const seriesOrder = [];
      const seriesMap = new Map();
      tree.forEach(item => {
        const sKey = item.series || '기타';
        if (!seriesMap.has(sKey)) {
          seriesMap.set(sKey, []);
          seriesOrder.push(sKey);
        }
        seriesMap.get(sKey).push(item);
      });

      seriesOrder.forEach(sName => {
        const groupEl = document.createElement('div');
        groupEl.className = 'series-group';

        const titleEl = document.createElement('div');
        titleEl.className = 'series-name';
        titleEl.textContent = `★ ${sName}`;
        groupEl.appendChild(titleEl);

        const itemsGrid = document.createElement('div');
        itemsGrid.className = 'series-items';

        const items = seriesMap.get(sName);
        items.forEach(item => {
          const isUnlocked = unlockedLevels.has(item.level);
          const card = document.createElement('div');
          card.className = `catalog-item-card ${isUnlocked ? '' : 'locked'}`;

          let iconContent = '❓';
          if (isUnlocked) {
            if (meta.isImageTheme && item.image) {
              const fb = currentTheme === 'elements'
                ? (item.symbol || '⚛️')
                : (currentTheme === 'robots' ? '🤖' : (currentTheme === 'scp' ? '☣️' : (currentTheme === 'trevor' ? '📻' : '🔴')));
              iconContent = `
                <img ${getDriveAtlasAttrs(item.image)} alt="${item.name}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <span style="display:none;font-weight:800;">${fb}</span>
              `;
            } else {
              iconContent = item.icon || '🍒';
            }
          }

          const extraTag = item.symbol
            ? ' · ' + item.symbol
            : (item.scp_id ? ' · ' + item.scp_id : (item.badge ? ' · ' + item.badge : ''));

          card.innerHTML = `
            <div class="catalog-icon">${iconContent}</div>
            <div class="catalog-name" title="${isUnlocked ? item.name : '???'}">${isUnlocked ? item.name : '???'}</div>
            <div class="catalog-lvl">Lv.${item.level}${extraTag}</div>
          `;
          card.addEventListener('click', () => {
            sound.init();
            sound.pickup();
            openItemDetailModal(item.level);
          });
          itemsGrid.appendChild(card);
        });

        groupEl.appendChild(itemsGrid);
        catalogList.appendChild(groupEl);
      });
    }

    let currentDetailLevel = 1;

    function getDetailSubtitleAndBadge(item, theme) {
      if (theme === 'elements') {
        return {
          badge: `원자번호 #${item.level} · ${item.symbol}`,
          subtitle: item.character_title || `${item.name} 원소 정령`
        };
      }
      if (theme === 'pokemon') {
        return {
          badge: `전국도감 #${String(item.pokedex_id || item.level).padStart(3, '0')}`,
          subtitle: item.category || item.series
        };
      }
      if (theme === 'robots') {
        return {
          badge: `출전: ${item.origin || '슈퍼 메카'}`,
          subtitle: item.series
        };
      }
      if (theme === 'scp') {
        return {
          badge: `${item.scp_id || 'SCP'} · ${item.object_class || 'Euclid'}`,
          subtitle: `격리 등급: ${item.object_class || 'Euclid'} · ${item.series}`
        };
      }
      if (theme === 'trevor') {
        return {
          badge: `${item.eng_name || item.badge || 'CRYPTID'}`,
          subtitle: `${item.threat_class || '미확인 괴이'} · 출몰지: ${item.habitat || '불명'}`
        };
      }
      if (theme === 'weapons') {
        return {
          badge: `${item.era || item.badge || '인류 무기사'}`,
          subtitle: `분류: ${item.category || '전술/전략 병기'} · ${item.series}`
        };
      }
      return {
        badge: item.series,
        subtitle: item.character_title || item.series
      };
    }

    function openItemDetailModal(level) {
      currentDetailLevel = level;
      const meta = THEME_META[currentTheme];
      const maxLvl = meta.maxLevel;
      const item = getItemData(level, currentTheme);
      const isUnlocked = unlockedLevels.has(level);
      const cosmicClass = (isUnlocked && level === maxLvl) ? 'tier-max-cosmic' : '';
      const tierClass = isUnlocked ? `tier-${level <= 120 ? level : (((level - 21) % 100) + 21)} ${cosmicClass}` : '';
      const { badge, subtitle } = getDetailSubtitleAndBadge(item, currentTheme);

      let heroVisual = '';
      if (!isUnlocked) {
        heroVisual = `<div class="detail-big-icon" style="opacity:0.45;">🔒</div>`;
      } else if (meta.isImageTheme && item.image) {
        const fb = currentTheme === 'elements'
          ? (item.symbol || '⚛️')
          : (currentTheme === 'robots' ? '🤖' : (currentTheme === 'scp' ? '☣️' : (currentTheme === 'trevor' ? '📻' : '🔴')));
        heroVisual = `
          <img ${getDriveAtlasAttrs(item.image)} alt="${item.name}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="detail-big-icon" style="display:none;">${fb}</div>
        `;
      } else {
        heroVisual = `<div class="detail-big-icon">${item.icon || '🍒'}</div>`;
      }

      let nextStepText = '🌟 최종 진화 단계!';
      if (level < maxLvl) {
        const nextItem = getItemData(level + 1, currentTheme);
        const nextUnlocked = unlockedLevels.has(level + 1);
        nextStepText = `Lv.${level + 1} ${nextUnlocked && nextItem ? nextItem.name : '??? (미해금)'}`;
      }

      const descText = isUnlocked
        ? (item.desc || `${item.name} (Lv.${item.level}) — ${item.series} 단계의 핵심 개체입니다.`)
        : `아직 해금되지 않은 미지의 존재입니다. 보드에서 [Lv.${Math.max(1, level - 1)}] 단계 두 개를 병합하여 도감 정보를 해금해 보세요!`;

      itemDetailCard.innerHTML = `
        <div class="detail-hero-box ${tierClass}" style="${!isUnlocked ? 'background: linear-gradient(135deg, #1e293b, #090e1a);' : ''}">
          <div class="detail-top-badges">
            <span class="detail-pill">Lv.${item.level} / ${maxLvl}</span>
            <span class="detail-pill accent">${isUnlocked ? badge : '미해금 기밀'}</span>
          </div>
          <div class="detail-visual-wrap">
            ${heroVisual}
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-title-area">
            <div class="detail-name">${isUnlocked ? item.name : `Lv.${item.level} ??? (미해금)`}</div>
            <div class="detail-subtitle">${isUnlocked ? subtitle : item.series}</div>
          </div>
          <div class="detail-desc-box">${descText}</div>
          <div class="detail-stats-grid">
            <div class="detail-stat-item">
              <div class="detail-stat-label">병합 획득 점수</div>
              <div class="detail-stat-val">+${formatNumber(item.points)}점</div>
            </div>
            <div class="detail-stat-item">
              <div class="detail-stat-label">다음 진화 단계</div>
              <div class="detail-stat-val" style="color:#38bdf8;">${nextStepText}</div>
            </div>
          </div>
          <div class="detail-nav-row">
            <button class="detail-nav-btn" id="detailPrevBtn" ${level <= 1 ? 'disabled' : ''}>◀ Lv.${Math.max(1, level - 1)}</button>
            <button class="detail-nav-btn close-primary" id="detailCloseBtn">닫기</button>
            <button class="detail-nav-btn" id="detailNextBtn" ${level >= maxLvl ? 'disabled' : ''}>Lv.${Math.min(maxLvl, level + 1)} ▶</button>
          </div>
        </div>
      `;

      document.getElementById('detailPrevBtn').addEventListener('click', () => {
        if (level > 1) {
          sound.pickup();
          openItemDetailModal(level - 1);
        }
      });
      document.getElementById('detailNextBtn').addEventListener('click', () => {
        if (level < maxLvl) {
          sound.pickup();
          openItemDetailModal(level + 1);
        }
      });
      document.getElementById('detailCloseBtn').addEventListener('click', () => {
        itemDetailModal.style.display = 'none';
      });

      itemDetailModal.style.display = 'flex';
    }

    itemDetailModal.addEventListener('click', (e) => {
      if (e.target === itemDetailModal) {
        itemDetailModal.style.display = 'none';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (itemDetailModal.style.display === 'flex') {
        if (e.key === 'Escape') itemDetailModal.style.display = 'none';
        else if (e.key === 'ArrowLeft' && currentDetailLevel > 1) openItemDetailModal(currentDetailLevel - 1);
        else if (e.key === 'ArrowRight' && currentDetailLevel < getMaxLevel()) openItemDetailModal(currentDetailLevel + 1);
      }
    });

    bookBtn.addEventListener('click', () => {
      renderCatalog();
      catalogModal.style.display = 'flex';
    });

    closeCatalog.addEventListener('click', () => {
      catalogModal.style.display = 'none';
    });

    catalogModal.addEventListener('click', (e) => {
      if (e.target === catalogModal) {
        catalogModal.style.display = 'none';
      }
    });

    /* ============================================================
       10. INITIALIZATION & LAUNCHER ON LOAD
    ============================================================ */
    migrateLegacySave();
    loadLastConfig();
    startOrResumeSlot(currentTheme, currentGridSize, false);
    openLauncherModal();
    requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
